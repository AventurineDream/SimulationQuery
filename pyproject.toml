[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "improv-troupe"
version = "0.1.0"
description = "Cast small local models as actors and let them improvise a scene from a plan."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
improv = "improv_troupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
improv_troupe = [
  "infrastructure/migrations/*.sql",
  "web/static/*.css",
  "web/static/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# Lint gate: `ruff check .` in CI, AGENTS.md, and README. Formatting is not enforced.
target-version = "py311"

[tool.ruff.lint]
# Only pyflakes error classes (syntax errors, invalid comparisons, undefined names)
# are selected: the tree passes them unchanged. Add F401, F841, E701, E702, and E731
# when their existing violations are cleaned up in their own commits.
select = ["E9", "F63", "F7", "F82"]

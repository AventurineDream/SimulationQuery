<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <rect width="1440" height="1024" fill="#e7e1d5"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #222724; }
    .onDark { fill: #f4efe5; }
    .mutedDark { fill: #aeb8b2; }
    .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: 1.8px; fill: #6c6b63; }
    .eyebrowDark { font-size: 10px; font-weight: 750; letter-spacing: 1.6px; fill: #aeb8b2; }
    .title { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
    .h2 { font-size: 20px; font-weight: 700; }
    .h3 { font-size: 14px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11px; fill: #6c6b63; }
    .tiny { font-size: 10px; fill: #6c6b63; }
    .serif { font-family: Charter, Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, monospace; }
    .surface { fill: #faf7f0; stroke: #c9c1b3; stroke-width: 1.2; }
    .soft { fill: #f5f0e7; stroke: #c9c1b3; stroke-width: 1.2; }
    .good { fill: #dce7de; stroke: #6e8e73; stroke-width: 1.1; }
    .warm { fill: #f3e5c9; stroke: #b98943; stroke-width: 1.1; }
    .info { fill: #dfe7ec; stroke: #637e95; stroke-width: 1.1; }
    .danger { fill: #f0dcd8; stroke: #aa6157; stroke-width: 1.1; }
    .goodText { fill: #334d39; }
    .warmText { fill: #5e4520; }
    .infoText { fill: #354f63; }
    .dangerText { fill: #6a302b; }
    .rule { stroke: #d3ccbf; stroke-width: 1; }
    .small.onDark, .tiny.onDark { fill: #f4efe5; }
  </style>

  <rect x="0" y="0" width="240" height="1024" fill="#26302d"/>
  <circle cx="38" cy="42" r="17" fill="#c56f42"/>
  <text x="29" y="47" class="h3 onDark">SQ</text>
  <text x="68" y="37" class="h3 onDark">Simulation Query</text>
  <text x="68" y="56" class="tiny mutedDark">PRIVATE OPERATOR</text>
  <text x="28" y="112" class="eyebrowDark">WORKSPACE</text>
  <circle cx="45" cy="155" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="160" class="body mutedDark">Home</text>
  <circle cx="45" cy="210" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="215" class="body mutedDark">Prepare</text>
  <circle cx="45" cy="265" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="270" class="body mutedDark">Live</text>
  <circle cx="45" cy="320" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="325" class="body mutedDark">Review</text>
  <circle cx="45" cy="375" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="380" class="body mutedDark">Diagnostics</text>
  <rect x="16" y="407" width="208" height="46" rx="11" fill="#3b4843"/>
  <rect x="20" y="417" width="4" height="26" rx="2" fill="#c56f42"/>
  <circle cx="45" cy="430" r="7" fill="none" stroke="#f4efe5" stroke-width="1.5"/>
  <text x="66" y="435" class="body onDark">Seasons</text>
  <line x1="28" y1="484" x2="212" y2="484" stroke="#46544e"/>
  <text x="28" y="520" class="eyebrowDark">SELECTED SEASON</text>
  <text x="28" y="553" class="h2 onDark">S02</text>
  <text x="28" y="576" class="small mutedDark">The Weather Library</text>
  <rect x="28" y="598" width="166" height="29" rx="8" fill="#31483a" stroke="#6e8e73"/>
  <text x="41" y="617" class="tiny onDark">PRIVATE COMPLETE</text>
  <text x="28" y="670" class="eyebrowDark">RELEASE MODE</text>
  <text x="28" y="698" class="small onDark">Optional projection</text>
  <text x="28" y="721" class="tiny mutedDark">Private archive unchanged</text>
  <text x="28" y="764" class="eyebrowDark">PROJECTION</text>
  <text x="28" y="791" class="small onDark">Draft · v1</text>
  <text x="28" y="812" class="mono tiny mutedDark">closure snapshot v18</text>
  <rect x="20" y="944" width="200" height="52" rx="11" fill="#1f2724" stroke="#53615b"/>
  <circle cx="44" cy="970" r="11" fill="#49554f"/>
  <text x="66" y="966" class="small onDark">Aven</text>
  <text x="66" y="983" class="tiny mutedDark">Owner-only console</text>

  <text x="280" y="55" class="eyebrow warmText">SEASONS / PUBLICATION REVIEW</text>
  <text x="280" y="99" class="title">Create a separate public projection.</text>
  <text x="280" y="130" class="body">The private archive remains authoritative and unchanged. Only the exact allowlisted preview can become public.</text>
  <rect x="1240" y="43" width="158" height="38" rx="10" class="warm"/>
  <text x="1273" y="67" class="small warmText">RELEASE REVIEW</text>

  <rect x="280" y="154" width="1118" height="52" rx="14" class="soft"/>
  <rect x="290" y="164" width="352" height="32" rx="9" class="info"/>
  <text x="405" y="184" class="small infoText">1 · Privacy and consent</text>
  <text x="762" y="184" class="small">2 · Exact public preview</text>
  <text x="1135" y="184" class="small">3 · Publish receipt</text>

  <rect x="280" y="226" width="390" height="374" rx="17" class="surface"/>
  <text x="304" y="260" class="eyebrow">RELEASE GATES · S02 ONLY</text>
  <text x="304" y="294" class="h2">Review before projection</text>
  <rect x="304" y="316" width="342" height="54" rx="11" class="good"/>
  <text x="322" y="339" class="h3 goodText">✓ Season is privately complete</text>
  <text x="322" y="358" class="tiny goodText">Closure receipt S02-close-01 verified</text>
  <rect x="304" y="382" width="342" height="54" rx="11" class="good"/>
  <text x="322" y="405" class="h3 goodText">✓ Consent ledger resolved</text>
  <text x="322" y="424" class="tiny goodText">Four participants · current at closure</text>
  <rect x="304" y="448" width="342" height="66" rx="11" class="warm"/>
  <text x="322" y="471" class="h3 warmText">! One held diary excluded</text>
  <text x="322" y="490" class="tiny warmText">Status reviewed; raw wellness remains private.</text>
  <text x="322" y="505" class="tiny warmText">No placeholder enters the public projection.</text>
  <rect x="304" y="526" width="342" height="54" rx="11" class="good"/>
  <text x="322" y="549" class="h3 goodText">✓ Allowlist and paths validated</text>
  <text x="322" y="568" class="tiny goodText">No private-root or escaped artifact paths</text>

  <rect x="690" y="226" width="708" height="374" rx="17" class="surface"/>
  <text x="714" y="260" class="eyebrow">EXACT PUBLIC PREVIEW · PROJECTION V1</text>
  <text x="714" y="294" class="h2">Simulation Query · S02 — The Weather Library</text>
  <text x="714" y="324" class="small">Public fields only · generated from closure snapshot v18</text>
  <line x1="714" y1="342" x2="1374" y2="342" class="rule"/>
  <text x="714" y="376" class="eyebrow">EPISODE 1 · MORNING</text>
  <text x="714" y="410" class="serif body">The archive receives a storm whose label changes whenever no one is looking.</text>
  <text x="714" y="438" class="serif body">Mara listens to the chamber wall. Tavi knots a safety line around the latch.</text>
  <text x="714" y="474" class="eyebrow">ACCEPTED DIARIES</text>
  <text x="714" y="508" class="serif body">Mara Venn · “The note behind the door was almost a question.”</text>
  <text x="714" y="536" class="serif body">Oren Vale · “The archive tasted like rain trapped in copper.”</text>
  <text x="714" y="568" class="small">2 runs · 31 turns · 4 consented diary entries · allowlisted projection only</text>
  <rect x="1194" y="544" width="180" height="38" rx="9" class="soft"/>
  <text x="1238" y="568" class="small">Open full preview</text>

  <rect x="280" y="622" width="390" height="252" rx="17" class="danger"/>
  <text x="304" y="657" class="eyebrow dangerText">NEVER IN THIS EXPORT</text>
  <text x="304" y="693" class="body dangerText">Private role sheets and orientation</text>
  <text x="304" y="725" class="body dangerText">Prompts, raw output, model identities</text>
  <text x="304" y="757" class="body dangerText">Hidden direction and actor-local memory</text>
  <text x="304" y="789" class="body dangerText">Raw wellness, held, missing, or revoked diaries</text>
  <line x1="304" y1="812" x2="646" y2="812" stroke="#c78c84"/>
  <text x="304" y="840" class="small dangerText">Exclusion is structurally validated, not visually hidden.</text>
  <text x="304" y="861" class="tiny dangerText">Reading this card exposes none of the source data.</text>

  <rect x="690" y="622" width="708" height="252" rx="17" class="warm"/>
  <rect x="690" y="622" width="5" height="252" rx="3" fill="#c56f42"/>
  <text x="718" y="657" class="eyebrow warmText">CONSEQUENTIAL COMMAND · NOT SUBMITTED</text>
  <text x="718" y="693" class="h2 warmText">Confirm the separate public release</text>
  <text x="718" y="727" class="body warmText">Type the season-qualified phrase exactly:</text>
  <rect x="718" y="746" width="430" height="52" rx="11" class="surface"/>
  <text x="738" y="778" class="small">Type “publish S02”</text>
  <rect x="1164" y="746" width="206" height="52" rx="11" fill="#dddeda" stroke="#bfc5c0"/>
  <text x="1227" y="778" class="h3">Publish v1</text>
  <text x="718" y="827" class="small warmText">Enabled only after exact intent and current projection-version check.</text>
  <text x="718" y="851" class="tiny warmText">This command cannot alter the private archive. Reading or navigating away never publishes.</text>

  <rect x="280" y="896" width="1118" height="66" rx="14" class="soft"/>
  <text x="304" y="923" class="eyebrow">IMMUTABLE RESULT AFTER SUBMISSION</text>
  <text x="304" y="949" class="h3">S02-public-v1</text>
  <text x="497" y="949" class="body">Manifest hash generated and displayed</text>
  <text x="842" y="949" class="body">Durable publication receipt</text>
  <text x="1167" y="949" class="small">Private archive retained</text>
</svg>

  <text x="304" y="646" class="eyebrow">FILTER</text>
  <rect x="304" y="666" width="172" height="36" rx="9" class="surface"/>
  <text x="320" y="689" class="small">Accepted only</text>
  <text x="304" y="736" class="eyebrow">READING POSITION</text>
  <text x="304" y="764" class="small">Turn 9 of 16</text>
  <rect x="304" y="784" width="172" height="6" rx="3" fill="#ded8cc"/>
  <rect x="304" y="784" width="96" height="6" rx="3" fill="#c56f42"/>
  <text x="304" y="824" class="tiny">Return here from Diagnostics</text>
  <rect x="304" y="848" width="172" height="72" rx="12" class="good"/>
  <text x="320" y="875" class="h3 goodText">Day complete</text>
  <text x="320" y="898" class="small goodText">6 / 6 durable runs</text>

  <rect x="524" y="236" width="560" height="734" rx="17" class="surface"/>
  <text x="550" y="272" class="eyebrow">RUN 06 · EVENING · ACCEPTED</text>
  <text x="550" y="311" class="h2">The vane answers</text>
  <text x="550" y="338" class="mono tiny">S02-run-06 · artifact v6 · canon · 14:02:40</text>
  <line x1="550" y1="362" x2="1058" y2="362" class="rule"/>

  <text x="550" y="397" class="eyebrow">IVY</text>
  <text x="550" y="425" class="serif body">“That isn’t north,” Ivy said. She steadied the brass vane with</text>
  <text x="550" y="448" class="serif body">two fingers, but the needle pulled toward the sealed atlas room.</text>
  <text x="550" y="482" class="eyebrow">HIGGS</text>
  <text x="550" y="510" class="serif body">Higgs checked the pressure ledger twice. “The instruments agree</text>
  <text x="550" y="533" class="serif body">with each other. They simply disagree with the building.”</text>
  <text x="550" y="567" class="eyebrow">LUNA</text>
  <text x="550" y="595" class="serif body">The dust rose from the shelves in one silver ribbon. Luna did not</text>
  <text x="550" y="618" class="serif body">touch it. “Then the building has entered the conversation.”</text>
  <text x="550" y="652" class="eyebrow">MASON</text>
  <text x="550" y="680" class="serif body">Mason closed the west shutter. The ribbon bent around his wrist</text>
  <text x="550" y="703" class="serif body">without touching him and pointed toward tomorrow’s forecast.</text>

  <rect x="550" y="742" width="508" height="72" rx="12" class="info"/>
  <text x="570" y="769" class="h3 infoText">2 newer accepted turns are available</text>
  <text x="570" y="793" class="small infoText">Your current text and scroll position have not changed.</text>
  <rect x="550" y="830" width="148" height="36" rx="9" fill="#26302d"/>
  <text x="576" y="853" class="small onDark">Load new material</text>
  <rect x="710" y="830" width="154" height="36" rx="9" class="surface"/>
  <text x="739" y="853" class="small">Keep reading here</text>
  <text x="550" y="904" class="tiny">Operational polling continues in the shell. This pane redraws only on request.</text>
  <rect x="550" y="926" width="180" height="26" rx="8" class="good"/>
  <text x="566" y="943" class="tiny goodText">POSITION SAVED · TURN 9</text>

  <rect x="1108" y="236" width="290" height="734" rx="17" class="soft"/>
  <text x="1132" y="272" class="eyebrow">DIARY DESK</text>
  <text x="1132" y="300" class="small">4 private · all complete</text>
  <rect x="1132" y="322" width="242" height="108" rx="13" class="surface"/>
  <text x="1150" y="349" class="h3">Higgs</text>
  <text x="1150" y="371" class="small">Private · accepted</text>
  <text x="1150" y="393" class="serif small">“The numbers were consistent.</text>
  <text x="1150" y="411" class="serif small">That was the unsettling part.”</text>
  <rect x="1132" y="444" width="242" height="108" rx="13" class="surface"/>
  <text x="1150" y="471" class="h3">Ivy</text>
  <text x="1150" y="493" class="small">Private · accepted</text>
  <text x="1150" y="515" class="serif small">“I wanted to ask the vane what</text>
  <text x="1150" y="533" class="serif small">it thought tomorrow meant.”</text>
  <rect x="1132" y="566" width="242" height="108" rx="13" class="surface"/>
  <text x="1150" y="593" class="h3">Luna</text>
  <text x="1150" y="615" class="small">Private · accepted</text>
  <text x="1150" y="637" class="serif small">“A listening building changes</text>
  <text x="1150" y="655" class="serif small">what silence is for.”</text>
  <rect x="1132" y="688" width="242" height="108" rx="13" class="surface"/>
  <text x="1150" y="715" class="h3">Mason</text>
  <text x="1150" y="737" class="small">Private · accepted</text>
  <text x="1150" y="759" class="serif small">“I closed the shutter because</text>
  <text x="1150" y="777" class="serif small">someone had to choose a wall.”</text>
  <rect x="1132" y="814" width="242" height="44" rx="10" fill="#26302d"/>
  <text x="1177" y="841" class="small onDark">Open Diary desk</text>
  <rect x="1132" y="874" width="242" height="64" rx="12" class="warm"/>
  <text x="1150" y="902" class="h3 warmText">Owner-only</text>
  <text x="1150" y="924" class="small warmText">No raw wellness text shown</text>

  <text x="28" y="520" class="eyebrowDark">SELECTED CONTEXT</text>
  <text x="28" y="553" class="h2 onDark">S02</text>
  <text x="28" y="576" class="small mutedDark">The Weather Library</text>
  <rect x="28" y="598" width="142" height="29" rx="8" fill="#32453c" stroke="#6e8e73"/>
  <text x="41" y="617" class="tiny onDark">RUNNING · PRIVATE</text>
  <text x="28" y="670" class="eyebrowDark">READING STATE</text>
  <text x="28" y="698" class="small onDark">Day 2 · Run 06</text>
  <text x="28" y="721" class="tiny mutedDark">Position saved locally</text>
  <text x="28" y="764" class="eyebrowDark">FRESHNESS</text>
  <text x="28" y="791" class="small onDark">Loaded 14:04:08</text>
  <text x="28" y="812" class="mono tiny mutedDark">review snapshot v106</text>
  <rect x="20" y="944" width="200" height="52" rx="11" fill="#1f2724" stroke="#53615b"/>
  <circle cx="44" cy="970" r="11" fill="#49554f"/>
  <text x="66" y="966" class="small onDark">Aven</text>
  <text x="66" y="983" class="tiny mutedDark">Owner-only console</text>

  <text x="280" y="55" class="eyebrow">REVIEW / DAY 2</text>
  <text x="280" y="101" class="title">Read what actually happened.</text>
  <text x="280" y="131" class="body">Accepted story and private diaries remain still until you load newer material.</text>
  <rect x="1132" y="43" width="124" height="38" rx="10" class="surface"/>
  <text x="1156" y="67" class="small">Reload review</text>
  <rect x="1268" y="43" width="130" height="38" rx="10" class="good"/>
  <text x="1285" y="67" class="small goodText">✓ SAVED POSITION</text>

  <rect x="280" y="160" width="1118" height="52" rx="13" class="soft"/>
  <rect x="292" y="170" width="104" height="32" rx="9" fill="#26302d"/>
  <text x="324" y="190" class="small onDark">Script</text>
  <text x="424" y="190" class="small">Diary desk</text>
  <text x="528" y="190" class="small">Cast &amp; continuity</text>
  <text x="675" y="190" class="small">Day summary</text>
  <text x="1230" y="190" class="mono tiny">loaded 14:04:08 · v106</text>

  <rect x="280" y="236" width="220" height="734" rx="17" class="soft"/>
  <text x="304" y="272" class="eyebrow">DAY 2 RUNS</text>
  <rect x="304" y="296" width="172" height="80" rx="12" class="surface"/>
  <text x="320" y="321" class="h3">Run 04 · Morning</text>
  <text x="320" y="344" class="small">16 turns · accepted</text>
  <text x="320" y="363" class="mono tiny">artifact v4</text>

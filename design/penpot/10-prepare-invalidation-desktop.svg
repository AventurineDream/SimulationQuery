<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <rect width="1440" height="1024" fill="#eef0ed"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #171a17; }
    .nav { fill: #1f2421; }
    .surface { fill: #ffffff; stroke: #c8cec9; stroke-width: 2; }
    .soft { fill: #e7ece8; stroke: #b8c0ba; stroke-width: 2; }
    .attention { fill: #f5ead7; stroke: #b4965a; stroke-width: 2; }
    .danger { fill: #f3e2df; stroke: #b17b71; stroke-width: 2; }
    .approved { fill: #e3eee7; stroke: #91aa9a; stroke-width: 2; }
    .active { fill: #e8edf0; stroke: #8fa2ad; stroke-width: 2; }
    .disabled { fill: #f1f2f0; stroke: #d7dbd8; stroke-width: 2; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #5a645e; }
    .title { font-size: 32px; font-weight: 700; }
    .h2 { font-size: 20px; font-weight: 700; }
    .h3 { font-size: 15px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; fill: #5f6862; }
    .navtext { font-size: 15px; fill: #dce2dd; }
    .navactive { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .inverse { fill: #ffffff; }
    .inverse-subtle { fill: #9fb0a6; }
    .line { stroke: #c8cec9; stroke-width: 2; }
  </style>

  <rect x="0" y="0" width="232" height="1024" class="nav"/>
  <text x="28" y="45" class="eyebrow inverse-subtle">AI IMPROV TROUPE</text>
  <text x="28" y="77" class="h2 inverse">Operator</text>
  <text x="32" y="147" class="navtext">Home</text>
  <rect x="16" y="170" width="200" height="46" rx="10" fill="#39423d"/>
  <text x="32" y="199" class="navactive">Prepare</text>
  <text x="32" y="252" class="navtext">Live</text>
  <text x="32" y="306" class="navtext">Review</text>
  <text x="32" y="360" class="navtext">Diagnostics</text>
  <text x="32" y="414" class="navtext">Seasons</text>

  <rect x="232" y="0" width="1208" height="74" fill="#ffffff" stroke="#c8cec9"/>
  <rect x="260" y="18" width="114" height="38" rx="19" fill="#dfeee6" stroke="#6f9c82"/>
  <text x="283" y="42" class="eyebrow">SANDBOX</text>
  <text x="402" y="34" class="small">Season</text><text x="402" y="54" class="h3">S02 — The Weather Library ▾</text>
  <text x="900" y="34" class="small">Preparation</text><text x="900" y="54" class="body">Revision impact review</text>
  <rect x="1246" y="18" width="162" height="38" rx="10" class="attention"/>
  <text x="1268" y="42" class="body">6 steps affected</text>

  <text x="272" y="120" class="eyebrow">PREPARE / OPENING REVISION</text>
  <text x="272" y="164" class="title">Opening v4 changes what later evidence means.</text>
  <text x="272" y="194" class="body">Review the dependency impact before saving. Nothing becomes stale until the explicit save action.</text>

  <rect x="272" y="222" width="300" height="742" rx="18" class="surface"/>
  <text x="296" y="258" class="h2">Preparation checklist</text>
  <rect x="288" y="286" width="268" height="54" rx="10" class="approved"/>
  <text x="306" y="310" class="h3">1 · Season idea</text><text x="306" y="329" class="small">Approved · unaffected</text>
  <rect x="288" y="350" width="268" height="62" rx="10" class="active"/>
  <text x="306" y="376" class="h3">2 · Opening</text><text x="306" y="397" class="small">Draft v4 · impact review</text>
  <rect x="288" y="422" width="268" height="62" rx="10" class="attention"/>
  <text x="306" y="448" class="h3">3 · Character cards</text><text x="306" y="469" class="small">Will invalidate · 4 approvals</text>
  <rect x="288" y="494" width="268" height="62" rx="10" class="attention"/>
  <text x="306" y="520" class="h3">4 · Model assignment</text><text x="306" y="541" class="small">Will become stale · v2</text>
  <rect x="288" y="566" width="268" height="62" rx="10" class="attention"/>
  <text x="306" y="592" class="h3">5 · Preflight</text><text x="306" y="613" class="small">Will invalidate · 8 checks</text>
  <rect x="288" y="638" width="268" height="62" rx="10" class="attention"/>
  <text x="306" y="664" class="h3">6 · Private preparation</text><text x="306" y="685" class="small">Will require regeneration</text>
  <rect x="288" y="710" width="268" height="62" rx="10" class="attention"/>
  <text x="306" y="736" class="h3">7 · Schedule preview</text><text x="306" y="757" class="small">Will require review</text>
  <rect x="288" y="782" width="268" height="62" rx="10" class="danger"/>
  <text x="306" y="808" class="h3">8 · Green review</text><text x="306" y="829" class="small">Will relock</text>
  <text x="296" y="884" class="small">Opening another step does not accept this revision.</text>
  <text x="296" y="906" class="small">Existing approved versions remain durable in history.</text>

  <rect x="596" y="222" width="792" height="742" rx="18" class="surface"/>
  <text x="620" y="258" class="eyebrow">IMPACT BEFORE SAVE</text>
  <text x="620" y="292" class="h2">Opening v3 → draft v4</text>

  <rect x="620" y="320" width="744" height="126" rx="14" class="active"/>
  <text x="644" y="350" class="eyebrow">WHAT CHANGED</text>
  <text x="644" y="382" class="body">Mara shifts from thermal systems engineer to maintenance archivist.</text>
  <text x="644" y="410" class="body">New world rule: the library relabels chambers after every storm.</text>
  <text x="644" y="432" class="small">Opening v3 remains the approved source until this draft is saved.</text>

  <text x="620" y="486" class="eyebrow">DEPENDENCY EFFECTS</text>
  <rect x="620" y="504" width="358" height="86" rx="12" class="attention"/>
  <text x="642" y="533" class="h3">Character cards · approvals invalidated</text>
  <text x="642" y="558" class="body">Each card returns to review against opening v4.</text>
  <text x="642" y="578" class="small">Prior card versions remain readable.</text>
  <rect x="994" y="504" width="370" height="86" rx="12" class="attention"/>
  <text x="1016" y="533" class="h3">Model assignments · stale</text>
  <text x="1016" y="558" class="body">Bindings remain recorded but lose approval.</text>
  <text x="1016" y="578" class="small">No model is silently replaced.</text>
  <rect x="620" y="606" width="358" height="86" rx="12" class="attention"/>
  <text x="642" y="635" class="h3">Preflight · eight results invalidated</text>
  <text x="642" y="660" class="body">Checks must rerun against approved artifacts.</text>
  <text x="642" y="680" class="small">The former receipt remains in history.</text>
  <rect x="994" y="606" width="370" height="86" rx="12" class="attention"/>
  <text x="1016" y="635" class="h3">Private preparation · regenerate</text>
  <text x="1016" y="660" class="body">Role sheets and orientation become stale.</text>
  <text x="1016" y="680" class="small">No private artifact is overwritten.</text>
  <rect x="620" y="708" width="358" height="86" rx="12" class="attention"/>
  <text x="642" y="737" class="h3">Schedule preview · review required</text>
  <text x="642" y="762" class="body">Cast expectations and diary plan need review.</text>
  <text x="642" y="782" class="small">Original dates do not silently move.</text>
  <rect x="994" y="708" width="370" height="86" rx="12" class="danger"/>
  <text x="1016" y="737" class="h3">Green review · relocked</text>
  <text x="1016" y="762" class="body">Green remains unavailable until reapproval.</text>
  <text x="1016" y="782" class="small">No queued season state changes now.</text>

  <rect x="620" y="826" width="494" height="90" rx="12" class="soft"/>
  <text x="644" y="856" class="eyebrow">DURABLE RESULT IF SAVED</text>
  <text x="644" y="884" class="body">Create opening v4 and explicit invalidation events.</text>
  <text x="644" y="904" class="small">Replaced approvals stay auditable; navigation remains read-only.</text>
  <rect x="1130" y="838" width="104" height="50" rx="10" class="soft"/>
  <text x="1158" y="869" class="body">Cancel</text>
  <rect x="1246" y="838" width="118" height="50" rx="10" fill="#1f2421"/>
  <text x="1265" y="869" class="navactive">Save v4</text>
  <text x="1130" y="910" class="small">Workflow action · receipt follows</text>
</svg>

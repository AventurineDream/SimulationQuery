<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <rect width="1440" height="1024" fill="#e7e1d5"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #222724; }
    .onDark { fill: #f4efe5; }
    .mutedDark { fill: #aeb8b2; }
    .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: 1.8px; fill: #6c6b63; }
    .eyebrowDark { font-size: 10px; font-weight: 750; letter-spacing: 1.6px; fill: #aeb8b2; }
    .title { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
    .h2 { font-size: 20px; font-weight: 700; }
    .h3 { font-size: 14px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11px; fill: #6c6b63; }
    .tiny { font-size: 10px; fill: #6c6b63; }
    .serif { font-family: Charter, Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, monospace; }
    .surface { fill: #faf7f0; stroke: #c9c1b3; stroke-width: 1.2; }
    .soft { fill: #f5f0e7; stroke: #c9c1b3; stroke-width: 1.2; }
    .good { fill: #dce7de; stroke: #6e8e73; stroke-width: 1.1; }
    .warm { fill: #f3e5c9; stroke: #b98943; stroke-width: 1.1; }
    .info { fill: #dfe7ec; stroke: #637e95; stroke-width: 1.1; }
    .danger { fill: #f0dcd8; stroke: #aa6157; stroke-width: 1.1; }
    .goodText { fill: #334d39; }
    .warmText { fill: #5e4520; }
    .infoText { fill: #354f63; }
    .dangerText { fill: #6a302b; }
    .rule { stroke: #d3ccbf; stroke-width: 1; }
    .small.onDark, .tiny.onDark { fill: #f4efe5; }
  </style>

  <rect x="0" y="0" width="240" height="1024" fill="#26302d"/>
  <circle cx="38" cy="42" r="17" fill="#c56f42"/>
  <text x="29" y="47" class="h3 onDark">SQ</text>
  <text x="68" y="37" class="h3 onDark">Simulation Query</text>
  <text x="68" y="56" class="tiny mutedDark">PRIVATE OPERATOR</text>
  <text x="28" y="112" class="eyebrowDark">WORKSPACE</text>
  <circle cx="45" cy="155" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="160" class="body mutedDark">Home</text>
  <circle cx="45" cy="210" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="215" class="body mutedDark">Prepare</text>
  <rect x="16" y="242" width="208" height="46" rx="11" fill="#3b4843"/>
  <rect x="20" y="252" width="4" height="26" rx="2" fill="#c56f42"/>
  <circle cx="45" cy="265" r="7" fill="none" stroke="#f4efe5" stroke-width="1.5"/>
  <text x="66" y="270" class="body onDark">Live</text>
  <circle cx="45" cy="320" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="325" class="body mutedDark">Review</text>
  <circle cx="45" cy="375" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="380" class="body mutedDark">Diagnostics</text>
  <circle cx="45" cy="430" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="435" class="body mutedDark">Seasons</text>
  <line x1="28" y1="484" x2="212" y2="484" stroke="#46544e"/>
  <text x="28" y="520" class="eyebrowDark">SELECTED CONTEXT</text>
  <text x="28" y="553" class="h2 onDark">S02 · Day 1</text>
  <text x="28" y="576" class="small mutedDark">Afternoon · Run 02</text>
  <rect x="28" y="598" width="138" height="29" rx="8" fill="#32453c" stroke="#6e8e73"/>
  <text x="41" y="617" class="tiny onDark">RUNNING · PRIVATE</text>
  <text x="28" y="670" class="eyebrowDark">AUTONOMOUS WORKER</text>
  <circle cx="34" cy="697" r="5" fill="#7fa487"/>
  <text x="48" y="701" class="small onDark">Healthy · lease held</text>
  <text x="28" y="724" class="tiny mutedDark">Browser may close safely</text>
  <text x="28" y="770" class="eyebrowDark">FRESHNESS</text>
  <text x="28" y="797" class="small onDark">Checked 13:08:24</text>
  <text x="28" y="818" class="mono tiny mutedDark">live snapshot v44</text>
  <rect x="20" y="944" width="200" height="52" rx="11" fill="#1f2724" stroke="#53615b"/>
  <circle cx="44" cy="970" r="11" fill="#49554f"/>
  <text x="66" y="966" class="small onDark">Aven</text>
  <text x="66" y="983" class="tiny mutedDark">Owner-only console</text>

  <text x="280" y="55" class="eyebrow">LIVE / PERFORMANCE SUPERVISION</text>
  <text x="280" y="99" class="title">Day 1 · Afternoon is moving without you.</text>
  <text x="280" y="130" class="body">The worker is healthy. Accepted story evidence stays still while you read.</text>
  <rect x="1240" y="43" width="158" height="38" rx="10" class="good"/>
  <text x="1270" y="67" class="small goodText">ATTENTION · 0</text>

  <rect x="280" y="162" width="750" height="172" rx="17" class="surface"/>
  <text x="304" y="198" class="eyebrow">CURRENT PERFORMANCE</text>
  <text x="304" y="231" class="h2">Run 02 · Round 3 of 4 · actor turn</text>
  <text x="304" y="260" class="body">Fiction time · 14:37 aboard the orbital archive</text>
  <text x="304" y="288" class="body">Scheduled 12:00 · actual 12:18:42 · elapsed 00:49:42 · delay +00:18:42</text>
  <text x="304" y="315" class="small">Accepted 10 of 16 actor turns · current call: Mara Venn · attempt 1 · 18 s</text>
  <rect x="820" y="184" width="184" height="52" rx="12" class="good"/>
  <text x="853" y="216" class="h3 goodText">IN PROGRESS</text>
  <text x="820" y="266" class="mono tiny">work item live:run2:r3:mara</text>
  <text x="820" y="292" class="small">No operator action required</text>

  <rect x="1054" y="162" width="344" height="172" rx="17" class="soft"/>
  <text x="1078" y="198" class="eyebrow">WORKER AND QUEUE</text>
  <text x="1078" y="231" class="body">Lease</text>
  <text x="1294" y="231" class="small goodText">HEALTHY</text>
  <text x="1078" y="259" class="body">Heartbeat</text>
  <text x="1302" y="259" class="small">8 s ago</text>
  <text x="1078" y="287" class="body">Downstream</text>
  <text x="1300" y="287" class="small">6 turns</text>
  <text x="1078" y="315" class="small">Next run · Evening · scheduled 18:00</text>

  <rect x="280" y="358" width="750" height="178" rx="17" class="good"/>
  <rect x="280" y="358" width="5" height="178" rx="3" fill="#c56f42"/>
  <text x="306" y="393" class="eyebrow goodText">LAST ACCEPTED BEAT · TURN 10</text>
  <text x="306" y="427" class="h2 goodText">Sable Reed · accepted at 13:07:51</text>
  <text x="306" y="459" class="serif body goodText">“The labels are not names,” Sable says.</text>
  <text x="306" y="484" class="serif body goodText">“They are promises the rooms remember.”</text>
  <text x="306" y="514" class="small goodText">Accepted private story only · no raw, rejected, prompt, role-sheet, or wellness material</text>
  <rect x="838" y="437" width="166" height="44" rx="10" fill="#26302d"/>
  <text x="866" y="464" class="small onDark">Open transcript</text>

  <rect x="1054" y="358" width="344" height="178" rx="17" class="soft"/>
  <text x="1078" y="393" class="eyebrow">DAY COMPLETION</text>
  <text x="1078" y="426" class="body">Morning diary obligations</text>
  <text x="1310" y="426" class="small goodText">4 / 4</text>
  <text x="1078" y="456" class="body">Afternoon run</text>
  <text x="1300" y="456" class="small goodText">RUNNING</text>
  <text x="1078" y="486" class="body">Day closure</text>
  <text x="1304" y="486" class="small warmText">BLOCKED</text>
  <text x="1078" y="514" class="small">Closure waits for scheduled work or resolution.</text>

  <rect x="280" y="560" width="750" height="402" rx="17" class="surface"/>
  <text x="304" y="596" class="h2">Stable transcript · opened at accepted turn 8</text>
  <rect x="304" y="618" width="702" height="70" rx="12" class="info"/>
  <text x="324" y="646" class="h3 infoText">2 newer accepted turns are available</text>
  <text x="324" y="670" class="small infoText">This reading surface has not moved or redrawn.</text>
  <rect x="846" y="634" width="142" height="38" rx="9" class="surface"/>
  <text x="870" y="658" class="small">Load new beats</text>
  <text x="304" y="729" class="eyebrow">ACCEPTED TURN 7 · OREN VALE</text>
  <text x="304" y="760" class="serif body">Oren tastes copper in the vented air and lowers the heat beneath the archive kettles.</text>
  <line x1="304" y1="786" x2="1006" y2="786" class="rule"/>
  <text x="304" y="824" class="eyebrow">ACCEPTED TURN 8 · TAVI NORTH</text>
  <text x="304" y="855" class="serif body">Tavi knots a service cable around the chamber latch, then listens for the storm to pull back.</text>
  <line x1="304" y1="881" x2="1006" y2="881" class="rule"/>
  <text x="304" y="912" class="small">Operational polling continues outside this pane. Refresh is always creator-triggered.</text>
  <text x="304" y="936" class="small">Reading position and expanded evidence are preserved wherever possible.</text>

  <rect x="1054" y="560" width="344" height="402" rx="17" class="soft"/>
  <text x="1078" y="596" class="h2">Valid controls</text>
  <rect x="1078" y="618" width="296" height="96" rx="13" class="info"/>
  <text x="1098" y="649" class="h3 infoText">Pause after current call</text>
  <text x="1098" y="675" class="small infoText">Preserves accepted work before stopping.</text>
  <rect x="1215" y="682" width="141" height="24" rx="7" class="surface"/>
  <text x="1242" y="698" class="tiny">Review pause</text>
  <rect x="1078" y="730" width="296" height="104" rx="13" class="surface"/>
  <text x="1098" y="761" class="h3">Private end journey</text>
  <text x="1098" y="787" class="small">Opens a read-only snapshot first.</text>
  <text x="1098" y="811" class="small">Never publishes or deletes evidence.</text>
  <rect x="1078" y="850" width="296" height="62" rx="12" class="soft"/>
  <text x="1098" y="879" class="h3">Resume unavailable while running</text>
  <text x="1078" y="938" class="tiny">Every submitted command returns a durable receipt.</text>
</svg>

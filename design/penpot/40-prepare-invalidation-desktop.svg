  <text x="28" y="520" class="eyebrowDark">SELECTED CONTEXT</text>
  <text x="28" y="553" class="h2 onDark">S02</text>
  <text x="28" y="576" class="small mutedDark">The Weather Library</text>
  <rect x="28" y="598" width="126" height="29" rx="8" fill="#4b4130" stroke="#b98943"/>
  <text x="41" y="617" class="tiny onDark">DRAFT · PRIVATE</text>
  <text x="28" y="670" class="eyebrowDark">IMPACT REVIEW</text>
  <text x="28" y="698" class="small onDark">Opening v3 → draft v4</text>
  <text x="28" y="721" class="tiny mutedDark">Nothing stale until saved</text>
  <text x="28" y="764" class="eyebrowDark">FRESHNESS</text>
  <text x="28" y="791" class="small onDark">Checked 11:11:32</text>
  <text x="28" y="812" class="mono tiny mutedDark">draft snapshot v20</text>
  <rect x="20" y="944" width="200" height="52" rx="11" fill="#1f2724" stroke="#53615b"/>
  <circle cx="44" cy="970" r="11" fill="#49554f"/>
  <text x="66" y="966" class="small onDark">Aven</text>
  <text x="66" y="983" class="tiny mutedDark">Owner-only console</text>

  <text x="280" y="55" class="eyebrow">PREPARE / OPENING REVISION</text>
  <text x="280" y="99" class="title">Opening v4 changes what later evidence means.</text>
  <text x="280" y="130" class="body">Review every dependency before saving. Nothing becomes stale until the explicit workflow action.</text>
  <rect x="1216" y="43" width="182" height="38" rx="10" class="warm"/>
  <text x="1240" y="67" class="small warmText">6 STEPS AFFECTED</text>

  <rect x="280" y="162" width="286" height="800" rx="17" class="soft"/>
  <text x="304" y="198" class="h2">Preparation checklist</text>
  <text x="304" y="222" class="small">Impact is visible before any durable change.</text>
  <rect x="296" y="242" width="254" height="57" rx="11" class="good"/>
  <text x="312" y="267" class="h3 goodText">1 · Season idea</text>
  <text x="312" y="287" class="small goodText">Approved · unaffected</text>
  <rect x="294" y="307" width="258" height="70" rx="12" fill="#fffaf2" stroke="#c56f42" stroke-width="2"/>
  <rect x="298" y="318" width="4" height="48" rx="2" fill="#c56f42"/>
  <text x="314" y="333" class="eyebrow">SELECTED</text>
  <text x="314" y="357" class="h3">2 · Opening</text>
  <text x="314" y="373" class="tiny">Draft v4 · impact review</text>
  <rect x="296" y="385" width="254" height="57" rx="11" class="warm"/>

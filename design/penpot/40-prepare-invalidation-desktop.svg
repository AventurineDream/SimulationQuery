  <text x="312" y="495" class="small warmText">Will become stale · v2</text>
  <rect x="296" y="515" width="254" height="57" rx="11" class="warm"/>
  <text x="312" y="540" class="h3 warmText">5 · Preflight</text>
  <text x="312" y="560" class="small warmText">Will invalidate · 8 checks</text>
  <rect x="296" y="580" width="254" height="57" rx="11" class="warm"/>
  <text x="312" y="605" class="h3 warmText">6 · Private preparation</text>
  <text x="312" y="625" class="small warmText">Will require regeneration</text>
  <rect x="296" y="645" width="254" height="57" rx="11" class="warm"/>
  <text x="312" y="670" class="h3 warmText">7 · Schedule preview</text>
  <text x="312" y="690" class="small warmText">Will require review</text>
  <rect x="296" y="710" width="254" height="57" rx="11" class="danger"/>
  <text x="312" y="735" class="h3 dangerText">8 · Green review</text>
  <text x="312" y="755" class="small dangerText">Will relock</text>
  <line x1="304" y1="794" x2="542" y2="794" class="rule"/>
  <text x="304" y="824" class="eyebrow">CURRENT TRUTH</text>
  <text x="304" y="852" class="h3">Opening v3 remains approved</text>
  <text x="304" y="875" class="small">Draft v4 changes no state until saved.</text>
  <text x="304" y="899" class="small">Existing versions remain durable in history.</text>

  <rect x="590" y="162" width="808" height="800" rx="17" class="surface"/>
  <text x="616" y="198" class="eyebrow">IMPACT BEFORE SAVE</text>
  <text x="616" y="231" class="h2">Opening v3 → draft v4</text>
  <rect x="616" y="256" width="756" height="118" rx="14" class="info"/>
  <text x="638" y="287" class="eyebrow infoText">WHAT CHANGED</text>
  <text x="638" y="319" class="body infoText">Mara shifts from thermal systems engineer to maintenance archivist.</text>
  <text x="638" y="347" class="body infoText">New world rule: the library relabels chambers after every storm.</text>
  <text x="1107" y="352" class="tiny infoText">Opening v3 remains approved until save.</text>
  <text x="616" y="409" class="eyebrow">DEPENDENCY EFFECTS</text>

  <rect x="616" y="428" width="366" height="104" rx="13" class="warm"/>
  <text x="636" y="458" class="h3 warmText">Character cards · approvals invalidated</text>
  <text x="636" y="485" class="body warmText">Each card returns to review against Opening v4.</text>
  <text x="636" y="511" class="small warmText">Prior card versions remain readable.</text>
  <rect x="996" y="428" width="376" height="104" rx="13" class="warm"/>
  <text x="1016" y="458" class="h3 warmText">Model assignments · stale</text>
  <text x="1016" y="485" class="body warmText">Bindings remain recorded but lose approval.</text>
  <text x="1016" y="511" class="small warmText">No model is silently replaced.</text>
  <rect x="616" y="546" width="366" height="104" rx="13" class="warm"/>
  <text x="636" y="576" class="h3 warmText">Preflight · eight results invalidated</text>
  <text x="636" y="603" class="body warmText">Checks must rerun against approved artifacts.</text>
  <text x="636" y="629" class="small warmText">The former receipt remains in history.</text>
  <rect x="996" y="546" width="376" height="104" rx="13" class="warm"/>
  <text x="1016" y="576" class="h3 warmText">Private preparation · regenerate</text>
  <text x="1016" y="603" class="body warmText">Role sheets and orientation become stale.</text>
  <text x="1016" y="629" class="small warmText">No private artifact is overwritten.</text>
  <rect x="616" y="664" width="366" height="104" rx="13" class="warm"/>
  <text x="636" y="694" class="h3 warmText">Schedule preview · review required</text>
  <text x="636" y="721" class="body warmText">Cast expectations and diary plan need review.</text>
  <text x="636" y="747" class="small warmText">Original dates do not silently move.</text>
  <rect x="996" y="664" width="376" height="104" rx="13" class="danger"/>
  <text x="1016" y="694" class="h3 dangerText">Green review · relocked</text>
  <text x="1016" y="721" class="body dangerText">Green remains unavailable until reapproval.</text>
  <text x="1016" y="747" class="small dangerText">No queued season state changes now.</text>

  <rect x="616" y="788" width="494" height="116" rx="14" class="soft"/>
  <text x="638" y="819" class="eyebrow">DURABLE RESULT IF SAVED</text>
  <text x="638" y="851" class="h3">Create Opening v4 and explicit invalidation events</text>
  <text x="638" y="876" class="small">Replaced approvals stay auditable; navigation remains read-only.</text>

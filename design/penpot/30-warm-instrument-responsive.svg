  <text x="806" y="344" class="small">Nothing needs intervention.</text>
  <rect x="806" y="368" width="308" height="198" rx="14" class="surface"/>
  <rect x="806" y="368" width="4" height="198" rx="2" fill="#c56f42"/>
  <text x="826" y="396" class="eyebrow">LAST ACCEPTED BEAT</text>
  <text x="826" y="425" class="h2">Run 06 · Evening</text>
  <text x="826" y="454" class="serif body">The brass vane turned toward a wind</text>
  <text x="826" y="474" class="serif body">no instrument could name. The shelves</text>
  <text x="826" y="494" class="serif body">answered with a ribbon of silver dust.</text>
  <text x="826" y="524" class="mono tiny">artifact v6 · accepted</text>
  <rect x="826" y="534" width="116" height="24" rx="7" fill="#26302d"/>
  <text x="844" y="550" class="tiny onDark">Open transcript</text>
  <rect x="806" y="582" width="308" height="116" rx="14" class="info"/>
  <text x="826" y="610" class="eyebrow">NEW MATERIAL</text>
  <text x="826" y="638" class="h3">2 accepted turns available</text>
  <text x="826" y="661" class="small">Your reading position stays fixed.</text>
  <rect x="826" y="670" width="118" height="22" rx="7" fill="#faf7f0" stroke="#637e95"/>
  <text x="842" y="685" class="tiny">Load when ready</text>

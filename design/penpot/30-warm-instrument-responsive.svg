<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <rect width="1440" height="1024" fill="#e7e1d5"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #222724; }
    .onDark { fill: #f4efe5; }
    .mutedDark { fill: #aeb8b2; }
    .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: 1.8px; fill: #6c6b63; }
    .eyebrowDark { font-size: 9px; font-weight: 750; letter-spacing: 1.4px; fill: #aeb8b2; }
    .title { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
    .screenTitle { font-size: 24px; font-weight: 700; letter-spacing: -.4px; }
    .h2 { font-size: 17px; font-weight: 700; }
    .h3 { font-size: 13px; font-weight: 700; }
    .body { font-size: 12px; }
    .small { font-size: 10px; fill: #6c6b63; }
    .tiny { font-size: 9px; fill: #6c6b63; }
    .serif { font-family: Charter, Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, monospace; }
    .surface { fill: #faf7f0; stroke: #c9c1b3; stroke-width: 1.2; }
    .soft { fill: #f5f0e7; stroke: #c9c1b3; stroke-width: 1.2; }
    .good { fill: #dce7de; stroke: #6e8e73; stroke-width: 1.1; }
    .warm { fill: #f3e5c9; stroke: #b98943; stroke-width: 1.1; }
    .info { fill: #dfe7ec; stroke: #637e95; stroke-width: 1.1; }
    .rule { stroke: #d3ccbf; stroke-width: 1; }
    .small.onDark, .tiny.onDark { fill: #f4efe5; }
  </style>

  <text x="56" y="54" class="eyebrow">30 / WARM INSTRUMENT / RESPONSIVE</text>
  <text x="56" y="101" class="title">Same capability. Different composition.</text>
  <text x="56" y="130" class="body">Desktop keeps context beside the work; narrow stacks it without hiding evidence, impact, or action.</text>

  <text x="56" y="166" class="eyebrow">DESKTOP · 1440 REFERENCE</text>

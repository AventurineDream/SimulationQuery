  <text x="1186" y="256" class="h3">Context compresses</text>
  <text x="1186" y="279" class="small">Season, privacy, lifecycle,</text>
  <text x="1186" y="297" class="small">worker, and freshness remain.</text>
  <line x1="1186" y1="322" x2="1362" y2="322" class="rule"/>
  <text x="1186" y="354" class="h3">Hierarchy stacks</text>
  <text x="1186" y="377" class="small">Truth before evidence;</text>
  <text x="1186" y="395" class="small">impact before action.</text>
  <line x1="1186" y1="420" x2="1362" y2="420" class="rule"/>
  <text x="1186" y="452" class="h3">Capability stays</text>
  <text x="1186" y="475" class="small">No desktop-only evidence,</text>
  <text x="1186" y="493" class="small">confirmation, or receipt.</text>
  <line x1="1186" y1="518" x2="1362" y2="518" class="rule"/>
  <text x="1186" y="550" class="h3">Reading stays still</text>
  <text x="1186" y="573" class="small">Polling cannot redraw text,</text>
  <text x="1186" y="591" class="small">move focus, or jump scroll.</text>
  <line x1="1186" y1="616" x2="1362" y2="616" class="rule"/>
  <text x="1186" y="648" class="h3">Actions stay clear</text>
  <text x="1186" y="671" class="small">Bottom navigation never</text>
  <text x="1186" y="689" class="small">covers the active action.</text>
  <line x1="1186" y1="714" x2="1362" y2="714" class="rule"/>
  <text x="1186" y="746" class="h3">Targets stay usable</text>
  <text x="1186" y="769" class="small">44 px minimum; visible focus;</text>
  <text x="1186" y="787" class="small">labels beside consequence.</text>
  <line x1="1186" y1="812" x2="1362" y2="812" class="rule"/>
  <text x="1186" y="844" class="h3">Breakpoint proposal</text>
  <text x="1186" y="867" class="small">Rail ≥ 920 px</text>
  <text x="1186" y="885" class="small">Bottom nav &lt; 920 px</text>
  <text x="1186" y="917" class="tiny">Final breakpoint follows real</text>
  <text x="1186" y="934" class="tiny">content testing, not device names.</text>

  <text x="56" y="988" class="small">RESPONSIVE ACCEPTANCE: narrow changes composition only; safety, privacy, evidence, and consequence remain complete.</text>

  <text x="76" y="604" class="tiny mutedDark">The Weather Library</text>
  <rect x="76" y="622" width="104" height="24" rx="7" fill="#32453c" stroke="#6e8e73"/>
  <text x="87" y="638" class="tiny onDark">RUNNING · PRIVATE</text>

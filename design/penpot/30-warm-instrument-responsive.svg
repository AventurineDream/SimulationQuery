  <text x="252" y="783" class="eyebrow">ATTENTION PREVIEW</text>
  <text x="252" y="812" class="h3">Opening revision affects 3 later steps</text>
  <text x="252" y="836" class="small">Review impact before saving. Existing versions remain durable.</text>
  <rect x="252" y="856" width="118" height="38" rx="9" class="warm"/>
  <text x="272" y="879" class="small">Review impact</text>
  <rect x="382" y="856" width="118" height="38" rx="9" class="surface"/>
  <text x="411" y="879" class="small">Not now</text>

  <text x="780" y="166" class="eyebrow">NARROW · 390 REFERENCE</text>
  <rect x="780" y="184" width="360" height="760" rx="28" fill="#f3efe6" stroke="#aaa294" stroke-width="2"/>
  <rect x="780" y="184" width="360" height="72" rx="28" fill="#26302d"/>

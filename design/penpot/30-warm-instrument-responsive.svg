  <text x="252" y="372" class="h2">Run 06 · Evening</text>
  <text x="252" y="401" class="serif body">The brass vane turned toward a wind no</text>
  <text x="252" y="421" class="serif body">instrument could name. The shelves answered</text>
  <text x="252" y="441" class="serif body">with a single silver ribbon of dust.</text>
  <text x="252" y="473" class="mono tiny">accepted 14:02:40 · artifact v6</text>
  <rect x="252" y="487" width="112" height="25" rx="7" fill="#26302d"/>
  <text x="270" y="504" class="tiny onDark">Open transcript</text>
  <rect x="560" y="312" width="168" height="210" rx="14" class="soft"/>

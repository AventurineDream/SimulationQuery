  <text x="826" y="769" class="h3">3 later steps become invalid</text>
  <text x="826" y="791" class="small">Nothing changes until you save.</text>
  <rect x="826" y="801" width="128" height="29" rx="8" fill="#26302d"/>
  <text x="844" y="820" class="tiny onDark">Continue to review</text>

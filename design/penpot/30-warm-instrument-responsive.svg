  <text x="580" y="372" class="h2">6 / 6 runs</text>
  <text x="580" y="397" class="small">Day complete</text>
  <line x1="580" y1="420" x2="708" y2="420" class="rule"/>
  <text x="580" y="446" class="tiny">DIARIES</text>
  <text x="580" y="469" class="h3">4 private · 0 due</text>
  <rect x="580" y="486" width="116" height="24" rx="7" class="good"/>
  <text x="592" y="502" class="tiny">NO ATTENTION DUE</text>

  <rect x="232" y="540" width="496" height="196" rx="14" class="surface"/>
  <text x="252" y="569" class="eyebrow">STABLE READING PANE</text>
  <text x="252" y="600" class="h2">End-of-day review</text>
  <text x="252" y="627" class="serif body">Luna closed the west shutters one at a time.</text>
  <text x="252" y="647" class="serif body">“If the library is listening, we should decide</text>
  <text x="252" y="667" class="serif body">what we want it to hear.”</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <rect width="1440" height="1024" fill="#e7e1d5"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #222724; }
    .onDark { fill: #f4efe5; }
    .mutedDark { fill: #aeb8b2; }
    .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: 1.8px; fill: #6c6b63; }
    .eyebrowDark { font-size: 10px; font-weight: 750; letter-spacing: 1.6px; fill: #aeb8b2; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
    .h2 { font-size: 20px; font-weight: 700; }
    .h3 { font-size: 14px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11px; fill: #6c6b63; }
    .tiny { font-size: 10px; fill: #6c6b63; }
    .serif { font-family: Charter, Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, monospace; }
    .surface { fill: #faf7f0; stroke: #c9c1b3; stroke-width: 1.2; }
    .soft { fill: #f5f0e7; stroke: #c9c1b3; stroke-width: 1.2; }
    .good { fill: #dce7de; stroke: #6e8e73; stroke-width: 1.1; }
    .warm { fill: #f3e5c9; stroke: #b98943; stroke-width: 1.1; }
    .info { fill: #dfe7ec; stroke: #637e95; stroke-width: 1.1; }
    .goodText { fill: #334d39; }
    .warmText { fill: #5e4520; }
    .infoText { fill: #354f63; }
    .rule { stroke: #d3ccbf; stroke-width: 1; }
    .small.onDark, .tiny.onDark { fill: #f4efe5; }
  </style>

  <rect x="0" y="0" width="240" height="1024" fill="#26302d"/>
  <circle cx="38" cy="42" r="17" fill="#c56f42"/>
  <text x="29" y="47" class="h3 onDark">SQ</text>
  <text x="68" y="37" class="h3 onDark">Simulation Query</text>
  <text x="68" y="56" class="tiny mutedDark">PRIVATE OPERATOR</text>

  <text x="28" y="112" class="eyebrowDark">WORKSPACE</text>
  <rect x="16" y="132" width="208" height="46" rx="11" fill="#3b4843"/>
  <rect x="20" y="142" width="4" height="26" rx="2" fill="#c56f42"/>
  <circle cx="45" cy="155" r="7" fill="none" stroke="#f4efe5" stroke-width="1.5"/>
  <text x="66" y="160" class="body onDark">Home</text>
  <circle cx="45" cy="210" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="215" class="body mutedDark">Prepare</text>
  <circle cx="45" cy="265" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="270" class="body mutedDark">Live</text>
  <circle cx="45" cy="320" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="325" class="body mutedDark">Review</text>
  <circle cx="45" cy="375" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="380" class="body mutedDark">Diagnostics</text>
  <circle cx="45" cy="430" r="7" fill="none" stroke="#8f9a94"/>
  <text x="66" y="435" class="body mutedDark">Seasons</text>

  <line x1="28" y1="484" x2="212" y2="484" stroke="#46544e"/>
  <text x="28" y="520" class="eyebrowDark">SELECTED CONTEXT</text>
  <text x="28" y="553" class="h2 onDark">S02</text>
  <text x="28" y="576" class="small mutedDark">The Weather Library</text>
  <rect x="28" y="598" width="142" height="29" rx="8" fill="#32453c" stroke="#6e8e73"/>
  <text x="41" y="617" class="tiny onDark">RUNNING · PRIVATE</text>
  <text x="28" y="670" class="eyebrowDark">WORKER</text>
  <circle cx="34" cy="697" r="5" fill="#7fa487"/>
  <text x="48" y="701" class="small onDark">Healthy · queue 2</text>
  <text x="28" y="746" class="eyebrowDark">FRESHNESS</text>
  <text x="28" y="773" class="small onDark">Checked 14:06:12</text>
  <text x="28" y="794" class="mono tiny mutedDark">snapshot v106</text>
  <rect x="20" y="944" width="200" height="52" rx="11" fill="#1f2724" stroke="#53615b"/>
  <circle cx="44" cy="970" r="11" fill="#49554f"/>
  <text x="66" y="966" class="small onDark">Aven</text>
  <text x="66" y="983" class="tiny mutedDark">Owner-only console</text>

  <text x="280" y="55" class="eyebrow">HOME / DAY 2</text>
  <text x="280" y="101" class="title">Keep the troupe in view.</text>
  <text x="280" y="131" class="body">The season is healthy. Nothing needs intervention right now.</text>
  <rect x="1180" y="45" width="218" height="38" rx="11" class="good"/>
  <text x="1201" y="69" class="small goodText">✓ DURABLE · FRESH · 14:06</text>

  <rect x="280" y="168" width="256" height="118" rx="15" class="surface"/>
  <text x="302" y="197" class="eyebrow">TODAY</text>
  <text x="302" y="234" class="h2">6 / 6 runs</text>
  <text x="302" y="260" class="small">Day complete · all slots durable</text>
  <rect x="552" y="168" width="256" height="118" rx="15" class="surface"/>
  <text x="574" y="197" class="eyebrow">DIARIES</text>
  <text x="574" y="234" class="h2">4 private</text>
  <text x="574" y="260" class="small">0 due · wellness held privately</text>
  <rect x="824" y="168" width="256" height="118" rx="15" class="surface"/>
  <text x="846" y="197" class="eyebrow">NEXT SLOT</text>
  <text x="846" y="234" class="h2">Tomorrow · Morning</text>
  <text x="846" y="260" class="small">Scheduled 09:00 Pacific</text>
  <rect x="1096" y="168" width="302" height="118" rx="15" class="good"/>
  <text x="1118" y="197" class="eyebrow goodText">OPERATOR ATTENTION</text>
  <text x="1118" y="234" class="h2 goodText">Nothing due</text>
  <text x="1118" y="260" class="small goodText">Autonomous work may continue</text>

  <rect x="280" y="310" width="720" height="304" rx="18" class="surface"/>
  <rect x="280" y="310" width="5" height="304" rx="3" fill="#c56f42"/>
  <text x="310" y="348" class="eyebrow">LAST ACCEPTED BEAT</text>
  <rect x="810" y="332" width="162" height="28" rx="8" class="good"/>
  <text x="826" y="350" class="tiny goodText">CANON · ARTIFACT v6</text>
  <text x="310" y="396" class="h2">Run 06 · Evening</text>
  <text x="310" y="430" class="serif body">The brass vane turned toward a wind no instrument could name.</text>
  <text x="310" y="454" class="serif body">Ivy watched the dust lift from the shelves in a single silver ribbon,</text>
  <text x="310" y="478" class="serif body">each grain holding the faint blue light of a forgotten forecast.</text>
  <line x1="310" y1="510" x2="970" y2="510" class="rule"/>
  <text x="310" y="540" class="mono tiny">accepted 14:02:40 · S02-run-06 · 16 turns · receipt beat-06F</text>
  <rect x="310" y="558" width="148" height="38" rx="10" fill="#26302d"/>
  <text x="334" y="582" class="small onDark">Open transcript</text>
  <text x="478" y="582" class="small">Reading stays still while operational status refreshes.</text>

  <rect x="1024" y="310" width="374" height="304" rx="18" class="soft"/>
  <text x="1050" y="348" class="eyebrow">NEXT UP</text>
  <text x="1050" y="389" class="h2">Day 3 · Morning</text>
  <text x="1050" y="417" class="body">The Weather Library reopens at 09:00 Pacific.</text>
  <line x1="1050" y1="445" x2="1372" y2="445" class="rule"/>
  <text x="1050" y="476" class="eyebrow">CAST</text>
  <circle cx="1057" cy="507" r="5" fill="#6e8e73"/>
  <text x="1072" y="512" class="small">Higgs · active</text>
  <circle cx="1182" cy="507" r="5" fill="#6e8e73"/>
  <text x="1197" y="512" class="small">Ivy · active</text>
  <circle cx="1057" cy="541" r="5" fill="#6e8e73"/>
  <text x="1072" y="546" class="small">Luna · active</text>
  <circle cx="1182" cy="541" r="5" fill="#6e8e73"/>
  <text x="1197" y="546" class="small">Mason · active</text>
  <rect x="1050" y="565" width="154" height="31" rx="9" class="surface"/>
  <text x="1072" y="585" class="small">Open schedule</text>

  <rect x="280" y="638" width="548" height="322" rx="18" class="surface"/>
  <text x="306" y="676" class="eyebrow">DAY 2 REVIEW</text>
  <text x="306" y="714" class="h2">Ready when you are</text>
  <text x="306" y="744" class="serif body">Read the accepted script and four private diaries without</text>
  <text x="306" y="768" class="serif body">the page moving underneath you. New accepted material is</text>
  <text x="306" y="792" class="serif body">loaded only when you ask for it.</text>
  <rect x="306" y="824" width="160" height="40" rx="10" fill="#26302d"/>
  <text x="335" y="849" class="small onDark">Open Day Review</text>
  <rect x="478" y="824" width="148" height="40" rx="10" class="surface"/>
  <text x="512" y="849" class="small">Review later</text>
  <rect x="306" y="890" width="496" height="44" rx="11" class="info"/>
  <text x="326" y="917" class="small infoText">2 new accepted turns will be available after the next durable beat.</text>

  <rect x="852" y="638" width="546" height="322" rx="18" class="soft"/>
  <text x="878" y="676" class="eyebrow">PRIVATE SYSTEM NOTES</text>
  <rect x="878" y="700" width="494" height="74" rx="13" class="good"/>
  <text x="900" y="728" class="h3 goodText">Archive reachable</text>
  <text x="900" y="751" class="small goodText">Integrity ok · latest receipt verified</text>
  <rect x="878" y="790" width="494" height="74" rx="13" class="surface"/>
  <text x="900" y="818" class="h3">No publication work in progress</text>
  <text x="900" y="841" class="small">Private close and public release remain separate journeys.</text>
  <rect x="878" y="880" width="494" height="54" rx="13" class="warm"/>
  <text x="900" y="913" class="small warmText">Manual review stays available; nothing is auto-dismissed.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <rect width="1440" height="1024" fill="#eceeea"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #1c2224; }
    .onBlue { fill: #ffffff; }
    .muted { fill: #697274; }
    .eyebrow { font-size: 11px; font-weight: 750; letter-spacing: 1.8px; fill: #496d83; }
    .eyebrowMuted { font-size: 10px; font-weight: 750; letter-spacing: 1.6px; fill: #697274; }
    .title { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
    .screenTitle { font-size: 29px; font-weight: 700; letter-spacing: -.6px; }
    .h2 { font-size: 18px; font-weight: 700; }
    .h3 { font-size: 14px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 11px; fill: #697274; }
    .tiny { font-size: 10px; fill: #697274; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'SFMono-Regular', Menlo, monospace; }
    .surface { fill: #ffffff; stroke: #c6cdca; stroke-width: 1.4; }
    .panel { fill: #f7f7f2; stroke: #c6cdca; stroke-width: 1.4; }
    .spec { fill: #f7f7f2; stroke: #bdc5c1; stroke-width: 1.5; }
    .good { fill: #e1e8e2; stroke: #718371; stroke-width: 1.1; }
    .warm { fill: #f2e8d5; stroke: #a67c3d; stroke-width: 1.1; }
    .danger { fill: #f0dfdd; stroke: #a15851; stroke-width: 1.1; }
    .info { fill: #e0e8ed; stroke: #496d83; stroke-width: 1.1; }
    .rule { stroke: #d5d9d7; stroke-width: 1; }
    .small.onBlue, .tiny.onBlue { fill: #ffffff; }
  </style>

  <text x="56" y="54" class="eyebrow">DIRECTION C / EDITORIAL ALTERNATIVE</text>
  <text x="56" y="101" class="title">Quiet Archive</text>
  <text x="310" y="99" class="body muted">A precise research desk whose oddness lives in content, not decoration.</text>

  <rect x="56" y="138" width="900" height="830" rx="10" fill="#f7f7f2" stroke="#aeb8b4" stroke-width="2"/>
  <path d="M66 138H261V968H66C60.5 968 56 963.5 56 958V148C56 142.5 60.5 138 66 138Z" fill="#e3e7e5"/>
  <rect x="76" y="158" width="86" height="35" rx="4" fill="#496d83"/>
  <text x="91" y="181" class="h3 onBlue">SQ / S02</text>
  <text x="76" y="218" class="tiny">PRIVATE OPERATOR RECORD</text>

  <text x="76" y="259" class="eyebrowMuted">INDEX</text>
  <rect x="68" y="276" width="185" height="38" rx="4" fill="#d3dcda"/>
  <text x="84" y="300" class="body">01 · Home</text>
  <text x="76" y="344" class="body muted">02 · Prepare</text>
  <text x="76" y="386" class="body muted">03 · Live</text>
  <text x="76" y="428" class="body muted">04 · Review</text>
  <text x="76" y="470" class="body muted">05 · Diagnostics</text>
  <text x="76" y="512" class="body muted">06 · Seasons</text>

  <line x1="76" y1="550" x2="233" y2="550" class="rule"/>
  <text x="76" y="581" class="eyebrowMuted">CURRENT RECORD</text>
  <text x="76" y="610" class="h3">S02</text>
  <text x="76" y="630" class="small">The Weather Library</text>
  <rect x="76" y="651" width="130" height="27" rx="4" class="good"/>
  <text x="88" y="669" class="tiny">RUNNING · PRIVATE</text>
  <text x="76" y="716" class="tiny">WORKER</text>
  <circle cx="81" cy="740" r="5" fill="#718371"/>
  <text x="94" y="744" class="small">Healthy · queue 2</text>
  <text x="76" y="784" class="tiny">CHECKED</text>
  <text x="76" y="807" class="small mono">14:06:12 / v106</text>
  <rect x="76" y="897" width="155" height="38" rx="4" fill="#f7f7f2" stroke="#aeb8b4"/>
  <text x="92" y="921" class="small">Owner-only record</text>

  <text x="293" y="182" class="eyebrow">HOME / DAY 2 / 2026-08-24</text>
  <text x="293" y="218" class="screenTitle">Keep the troupe in view.</text>
  <text x="293" y="244" class="body muted">Season state is current. No operator attention is due.</text>
  <rect x="778" y="172" width="150" height="31" rx="4" class="good"/>
  <text x="795" y="192" class="tiny">DURABLE · FRESH</text>

  <rect x="293" y="278" width="407" height="264" rx="6" class="surface"/>
  <text x="317" y="310" class="eyebrowMuted">LAST ACCEPTED BEAT / ARTIFACT v6</text>
  <text x="317" y="345" class="h2">Run 06 · Evening</text>
  <text x="317" y="373" class="serif body">The brass vane turned toward a wind no</text>
  <text x="317" y="395" class="serif body">instrument could name. Ivy watched the dust</text>
  <text x="317" y="417" class="serif body">lift from the shelves in a single silver ribbon.</text>
  <line x1="317" y1="441" x2="676" y2="441" class="rule"/>
  <text x="317" y="470" class="tiny mono">accepted_at 14:02:40 · canon=true</text>
  <rect x="317" y="490" width="132" height="31" rx="4" fill="#496d83"/>
  <text x="335" y="510" class="small onBlue">Open transcript</text>
  <text x="465" y="510" class="small">Reading remains stable</text>

  <rect x="716" y="278" width="212" height="264" rx="6" class="panel"/>
  <text x="738" y="310" class="eyebrowMuted">DAY SUMMARY</text>
  <text x="738" y="345" class="h2">6 / 6 runs</text>
  <text x="738" y="369" class="small">Complete</text>
  <line x1="738" y1="394" x2="906" y2="394" class="rule"/>
  <text x="738" y="421" class="tiny">DIARIES</text>
  <text x="738" y="446" class="h3">4 private · 0 due</text>
  <text x="738" y="474" class="tiny">NEXT SLOT</text>
  <text x="738" y="499" class="h3">Tomorrow · Morning</text>
  <rect x="738" y="512" width="125" height="22" rx="4" class="good"/>
  <text x="750" y="527" class="tiny">NO ATTENTION DUE</text>

  <rect x="293" y="560" width="635" height="202" rx="6" class="surface"/>
  <text x="317" y="592" class="eyebrowMuted">STABLE READING PANE / REVIEW</text>
  <text x="317" y="626" class="h2">End-of-day review</text>
  <text x="317" y="652" class="serif body">Luna closed the west shutters one at a time. “If the library</text>
  <text x="317" y="674" class="serif body">is listening,” she said, “we should decide what we want it to hear.”</text>
  <text x="317" y="710" class="small">Polling updates the record header; open text and scroll position stay fixed.</text>
  <rect x="317" y="724" width="144" height="26" rx="4" class="info"/>
  <text x="331" y="742" class="tiny">NEW MATERIAL AVAILABLE</text>

  <rect x="293" y="782" width="635" height="151" rx="6" class="panel"/>
  <text x="317" y="814" class="eyebrowMuted">ACTION SCALE</text>
  <rect x="317" y="841" width="102" height="36" rx="4" fill="#496d83"/>
  <text x="345" y="864" class="small onBlue">Open</text>
  <rect x="431" y="841" width="118" height="36" rx="4" fill="#ffffff" stroke="#aeb8b4"/>
  <text x="455" y="864" class="small">Save draft</text>
  <rect x="561" y="841" width="132" height="36" rx="4" class="warm"/>
  <text x="581" y="864" class="small">Review impact</text>
  <rect x="705" y="841" width="155" height="36" rx="4" class="danger"/>
  <text x="723" y="864" class="small">Type intent first</text>
  <text x="317" y="907" class="small mono">READ / LIGHT / WORKFLOW / CONSEQUENTIAL</text>

  <rect x="980" y="138" width="404" height="830" rx="10" class="spec"/>
  <text x="1006" y="174" class="eyebrow">VISUAL CONTRACT</text>
  <text x="1006" y="210" class="h2">Editorial, not bureaucratic</text>
  <text x="1006" y="234" class="small">Structure is explicit; the fiction supplies the strangeness.</text>

  <text x="1006" y="280" class="eyebrowMuted">CORE PALETTE</text>
  <rect x="1006" y="300" width="62" height="44" rx="4" fill="#f7f7f2" stroke="#bdc5c1"/>
  <rect x="1078" y="300" width="62" height="44" rx="4" fill="#1c2224"/>
  <rect x="1150" y="300" width="62" height="44" rx="4" fill="#496d83"/>
  <rect x="1222" y="300" width="62" height="44" rx="4" fill="#718371"/>
  <rect x="1294" y="300" width="62" height="44" rx="4" fill="#a15851"/>
  <text x="1006" y="363" class="tiny mono">PAPER</text>
  <text x="1078" y="363" class="tiny mono">CARBON</text>
  <text x="1150" y="363" class="tiny mono">COBALT</text>
  <text x="1222" y="363" class="tiny mono">MOSS</text>
  <text x="1294" y="363" class="tiny mono">BRICK</text>

  <line x1="1006" y1="392" x2="1358" y2="392" class="rule"/>
  <text x="1006" y="424" class="eyebrowMuted">TYPE ROLES</text>
  <text x="1006" y="456" class="h2">Inter / system</text>
  <text x="1006" y="487" class="serif h2">Georgia / reading voice</text>
  <text x="1006" y="516" class="mono small">SF Mono / audit ref v106</text>
  <text x="1006" y="542" class="small">Labels use record-like syntax sparingly; fiction stays humane.</text>

  <line x1="1006" y1="570" x2="1358" y2="570" class="rule"/>
  <text x="1006" y="602" class="eyebrowMuted">SHAPE &amp; RHYTHM</text>
  <text x="1006" y="632" class="body">8 px base grid · 4–10 px radii</text>
  <text x="1006" y="657" class="body">Thin cool-gray borders · zero shadow</text>
  <text x="1006" y="682" class="body">More visible metadata, fewer decorative badges</text>
  <text x="1006" y="707" class="body">Blue means selection and navigation, not status</text>

  <line x1="1006" y1="737" x2="1358" y2="737" class="rule"/>
  <text x="1006" y="769" class="eyebrowMuted">STATE PALETTE</text>
  <rect x="1006" y="790" width="162" height="36" rx="4" class="good"/>
  <text x="1022" y="813" class="small">Success / durable</text>
  <rect x="1180" y="790" width="176" height="36" rx="4" class="warm"/>
  <text x="1196" y="813" class="small">Attention / decision</text>
  <rect x="1006" y="838" width="162" height="36" rx="4" class="danger"/>
  <text x="1022" y="861" class="small">Danger / blocked</text>
  <rect x="1180" y="838" width="176" height="36" rx="4" class="info"/>
  <text x="1196" y="861" class="small">Info / new material</text>

  <text x="1006" y="910" class="h3">Signature gesture</text>
  <text x="1006" y="934" class="small">Every accepted artifact receives a small record stamp:</text>
  <text x="1006" y="951" class="small mono">S02 / RUN-06 / ACCEPTED / v6</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <rect width="1440" height="1120" fill="#f4f4f1"/>
  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #171a17; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #53605a; }
    .title { font-size: 38px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #59615d; }
    .h2 { font-size: 20px; font-weight: 700; }
    .h3 { font-size: 14px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; fill: #59615d; }
    .tiny { font-size: 11px; fill: #59615d; }
    .card { fill: #ffffff; stroke: #c8cec9; stroke-width: 2; }
    .soft { fill: #e7ece8; stroke: #b8c0ba; stroke-width: 2; }
    .attention { fill: #f5ead7; stroke: #b4965a; stroke-width: 2; }
    .danger { fill: #f3e2df; stroke: #b17b71; stroke-width: 2; }
    .approved { fill: #e3eee7; stroke: #91aa9a; stroke-width: 2; }
    .active { fill: #e8edf0; stroke: #8fa2ad; stroke-width: 2; }
    .disabled { fill: #f1f2f0; stroke: #d7dbd8; stroke-width: 2; }
    .rule { stroke: #d5d9d6; stroke-width: 1; }
  </style>

  <text x="56" y="55" class="eyebrow">20 — EXCEPTIONAL STATES / LOW-FIDELITY CONTRACT</text>
  <text x="56" y="106" class="title">Failure should clarify the dashboard—not erase it</text>
  <text x="56" y="138" class="subtitle">Every exceptional state says what is true, what remains readable, what action is valid, and what is blocked.</text>

  <rect x="56" y="170" width="1328" height="58" rx="14" class="active"/>
  <text x="78" y="195" class="h3">EMPTY-STATE VOCABULARY</text>
  <text x="78" y="216" class="small">Nothing exists · nothing is due · data is unavailable · query failed — never collapse these into “No data.”</text>

  <rect x="56" y="250" width="424" height="230" rx="16" class="card"/>
  <rect x="56" y="250" width="424" height="46" rx="16" class="active"/>
  <text x="76" y="279" class="h2">1 · Loading initial truth</text>
  <text x="76" y="322" class="h3">TRUE</text>
  <text x="132" y="322" class="body">A first authoritative read is still pending.</text>
  <text x="76" y="354" class="h3">READ</text>
  <text x="132" y="354" class="body">Shell, selected season, and prior receipt remain.</text>
  <text x="76" y="386" class="h3">VALID</text>
  <text x="132" y="386" class="body">Wait, cancel navigation, or inspect known evidence.</text>
  <text x="76" y="418" class="h3">BLOCK</text>
  <text x="132" y="418" class="body">Workflow and consequential commands.</text>
  <text x="76" y="454" class="small">Skeletons preserve layout; no fake zero values.</text>

  <rect x="508" y="250" width="424" height="230" rx="16" class="card"/>
  <rect x="508" y="250" width="424" height="46" rx="16" class="approved"/>
  <text x="528" y="279" class="h2">2 · Fresh and authoritative</text>
  <text x="528" y="322" class="h3">TRUE</text>
  <text x="584" y="322" class="body">Snapshot version and checked time are current.</text>
  <text x="528" y="354" class="h3">READ</text>
  <text x="584" y="354" class="body">All evidence appropriate to this destination.</text>
  <text x="528" y="386" class="h3">VALID</text>
  <text x="584" y="386" class="body">Actions allowed by lifecycle and prerequisites.</text>
  <text x="528" y="418" class="h3">BLOCK</text>
  <text x="584" y="418" class="body">Anything invalid for the selected season state.</text>
  <text x="528" y="454" class="small">Fresh is evidence, not a decorative green dot.</text>

  <rect x="960" y="250" width="424" height="230" rx="16" class="card"/>
  <rect x="960" y="250" width="424" height="46" rx="16" class="attention"/>
  <text x="980" y="279" class="h2">3 · Stale but readable</text>
  <text x="980" y="322" class="h3">TRUE</text>
  <text x="1036" y="322" class="body">Last known snapshot is older than its threshold.</text>
  <text x="980" y="354" class="h3">READ</text>
  <text x="1036" y="354" class="body">Durable evidence stays visible and time-labeled.</text>
  <text x="980" y="386" class="h3">VALID</text>
  <text x="1036" y="386" class="body">Refresh or continue non-mutating inspection.</text>
  <text x="980" y="418" class="h3">BLOCK</text>
  <text x="1036" y="418" class="body">State-dependent mutation until revalidated.</text>
  <text x="980" y="454" class="small">Never blank a transcript merely because polling lags.</text>

  <rect x="56" y="502" width="424" height="230" rx="16" class="card"/>
  <rect x="56" y="502" width="424" height="46" rx="16" class="danger"/>
  <text x="76" y="531" class="h2">4 · Disconnected</text>
  <text x="76" y="574" class="h3">TRUE</text>
  <text x="132" y="574" class="body">The latest query failed or service is unreachable.</text>
  <text x="76" y="606" class="h3">READ</text>
  <text x="132" y="606" class="body">Last durable snapshot, local receipt, help path.</text>
  <text x="76" y="638" class="h3">VALID</text>
  <text x="132" y="638" class="body">Retry connection; copy diagnostic reference.</text>
  <text x="76" y="670" class="h3">BLOCK</text>
  <text x="132" y="670" class="body">All remote mutations and false success states.</text>
  <text x="76" y="706" class="small">Failure time and last-success time both stay visible.</text>

  <rect x="508" y="502" width="424" height="230" rx="16" class="card"/>
  <rect x="508" y="502" width="424" height="46" rx="16" class="attention"/>
  <text x="528" y="531" class="h2">5 · Partial or missing artifact</text>
  <text x="528" y="574" class="h3">TRUE</text>
  <text x="584" y="574" class="body">The record exists; a named artifact does not.</text>
  <text x="528" y="606" class="h3">READ</text>
  <text x="584" y="606" class="body">Accepted portions, failed attempt, causal evidence.</text>
  <text x="528" y="638" class="h3">VALID</text>
  <text x="584" y="638" class="body">Open Diagnostics or the specific recovery step.</text>
  <text x="528" y="670" class="h3">BLOCK</text>
  <text x="584" y="670" class="body">Pretending completion or silently synthesizing it.</text>
  <text x="528" y="706" class="small">“Missing diary” differs from “diary not yet due.”</text>

  <rect x="960" y="502" width="424" height="230" rx="16" class="card"/>
  <rect x="960" y="502" width="424" height="46" rx="16" class="disabled"/>
  <text x="980" y="531" class="h2">6 · No season selected / exists</text>
  <text x="980" y="574" class="h3">TRUE</text>
  <text x="1036" y="574" class="body">No season context is available for this task.</text>
  <text x="980" y="606" class="h3">READ</text>
  <text x="1036" y="606" class="body">Global shell, lifecycle explanation, past archive.</text>
  <text x="980" y="638" class="h3">VALID</text>
  <text x="1036" y="638" class="body">Select an existing season or begin Prepare.</text>
  <text x="980" y="670" class="h3">BLOCK</text>
  <text x="1036" y="670" class="body">Season-scoped commands without explicit context.</text>
  <text x="980" y="706" class="small">Never silently fall back to the newest season.</text>

  <rect x="56" y="754" width="424" height="230" rx="16" class="card"/>
  <rect x="56" y="754" width="424" height="46" rx="16" class="attention"/>
  <text x="76" y="783" class="h2">7 · Invalid deep link / return path</text>
  <text x="76" y="826" class="h3">TRUE</text>
  <text x="132" y="826" class="body">Target moved, was removed, or is not permitted.</text>
  <text x="76" y="858" class="h3">READ</text>
  <text x="132" y="858" class="body">Selected season and nearest durable parent.</text>
  <text x="76" y="890" class="h3">VALID</text>
  <text x="132" y="890" class="body">Return to named parent or copy reference.</text>
  <text x="76" y="922" class="h3">BLOCK</text>
  <text x="132" y="922" class="body">Silent redirect to unrelated latest material.</text>
  <text x="76" y="958" class="small">Explain the broken target without losing context.</text>

  <rect x="508" y="754" width="424" height="230" rx="16" class="card"/>
  <rect x="508" y="754" width="424" height="46" rx="16" class="danger"/>
  <text x="528" y="783" class="h2">8 · Command conflict / replay / reject</text>
  <text x="528" y="826" class="h3">TRUE</text>
  <text x="584" y="826" class="body">Request did not create the assumed new result.</text>
  <text x="528" y="858" class="h3">READ</text>
  <text x="584" y="858" class="body">Submitted intent, receipt, version, actual state.</text>
  <text x="528" y="890" class="h3">VALID</text>
  <text x="584" y="890" class="body">Reconcile state; inspect idempotent prior receipt.</text>
  <text x="528" y="922" class="h3">BLOCK</text>
  <text x="584" y="922" class="body">Blind resubmit or optimistic success message.</text>
  <text x="528" y="958" class="small">Conflict, replay, validation reject, and failure differ.</text>

  <rect x="960" y="754" width="424" height="230" rx="16" class="card"/>
  <rect x="960" y="754" width="424" height="46" rx="16" class="active"/>
  <text x="980" y="783" class="h2">9 · Narrow + keyboard operation</text>
  <text x="980" y="826" class="h3">TRUE</text>
  <text x="1036" y="826" class="body">Space or input method changes, capability does not.</text>
  <text x="980" y="858" class="h3">READ</text>
  <text x="1036" y="858" class="body">Same context, evidence, impact, intent, receipt.</text>
  <text x="980" y="890" class="h3">VALID</text>
  <text x="1036" y="890" class="body">Logical focus, stacked detail, explicit disclosures.</text>
  <text x="980" y="922" class="h3">BLOCK</text>
  <text x="1036" y="922" class="body">Hover-only detail, color-only state, focus jumps.</text>
  <text x="980" y="958" class="small">Bottom navigation never covers the active action.</text>

  <rect x="56" y="1008" width="1328" height="66" rx="14" class="approved"/>
  <text x="78" y="1035" class="h3">POLLING CONTRACT</text>
  <text x="78" y="1058" class="body">Operational chrome may refresh; open transcripts, diaries, raw output, forms, selections, and scroll positions remain stable until the creator asks.</text>
  <text x="56" y="1102" class="small">EXCEPTIONAL-STATE ACCEPTANCE: uncertainty remains visible without erasing known truth, exposing private material, or enabling unsafe action.</text>
</svg>

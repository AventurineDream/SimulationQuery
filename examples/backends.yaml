# Maps logical backend handles -> real endpoints on your two machines.
# Plans reference these handles (or casting hints), never raw URLs, so plans
# stay portable. Replace the .local hostnames below with your real hostnames/IPs
# (a Mac mini advertises <name>.local via Bonjour; set the laptop's to taste).
#
# Both LM Studio (:1234) and Ollama (:11434) expose an OpenAI-compatible /v1.
# The `models:` lists let casting hints resolve without a live probe; run
# `improv backends examples/backends.yaml` to see what's actually loaded.
#
# Turns are sequential (round-robin), so the limit is RAM to keep models WARM,
# not parallel compute. Tip: set OLLAMA_KEEP_ALIVE=30m and
# OLLAMA_MAX_LOADED_MODELS=3 on each host so models don't unload between turns.

backends:
  # 16GB M2 Mac mini — the workhorse (Metal-accelerated). Do the heavy lifting here.
  mac:
    base_url: "http://mac-mini.local:11434/v1"
    kind: ollama
    models:
      - "qwen3:4b"      # ~2.6GB — smartest voice / lead
      - "qwen2.5:3b"    # ~2GB   — reuse across a couple of characters
      - "gemma2:2b"     # ~1.6GB — a contrasting family/voice
      - "llama3.2:3b"   # ~2GB   — optional extra voice

  # 8GB Linux laptop, CPU-only — keep to 1-1.5B or turns get slow.
  laptop:
    base_url: "http://laptop.local:11434/v1"
    kind: ollama
    models:
      - "llama3.2:1b"    # ~0.8GB — fast even on CPU
      - "qwen2.5:1.5b"   # ~1.1GB — strong for its size

  # Optional: LM Studio on the Mac if you prefer its server/UI instead of Ollama.
  mac-lmstudio:
    base_url: "http://mac-mini.local:1234/v1"
    kind: lmstudio
    api_key: "lm-studio"
    models: []

# Used as a last-resort fallback when an actor has no concrete binding and no
# hint matches any backend's advertised models.
default_backend: mac
